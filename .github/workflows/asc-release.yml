name: ASC Release

# Статус версии в App Store Connect и отправка на проверку Apple через API-ключ.
# Запускается только вручную.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "status — только чтение; submit — отправить версию на проверку"
        required: true
        default: status
        type: choice
        options:
          - status
          - submit
      version:
        description: "Версия для submit (например 3.7)"
        required: false
        default: "3.7"

permissions:
  contents: read

jobs:
  asc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pyjwt cryptography
      - name: Run
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "submit" ]; then
            python .github/scripts/asc_release.py submit "${{ github.event.inputs.version }}"
          else
            python .github/scripts/asc_release.py status
          fi
