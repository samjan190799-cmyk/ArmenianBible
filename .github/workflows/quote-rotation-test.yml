name: Quote Rotation Test

# Запускает настоящий Swift-код порядка смены цитат в виджете (Sources/QuoteRotation.swift).
# В TestFlight ничего не отправляет: запускается на пуш в feat/** и вручную.
on:
  push:
    branches: [ "feat/**" ]
    paths:
      - "Sources/QuoteRotation.swift"
      - "Tools/QuoteRotationTest/**"
      - ".github/workflows/quote-rotation-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotation:
    name: Порядок смены цитат (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Компиляция
        run: |
          swiftc -O Sources/QuoteRotation.swift Tools/QuoteRotationTest/main.swift -o quote_rotation_test

      - name: Запуск
        run: |
          ./quote_rotation_test
