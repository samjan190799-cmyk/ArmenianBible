name: AI proxy (Cloudflare Worker)

on:
  push:
    paths:
      - 'cloudflare/ai-proxy/**'
      - '.github/workflows/ai-proxy.yml'
  # Ручной запуск (Actions, Run workflow): передаёт Worker новые ключи задач после смены секретов GitHub
  workflow_dispatch:

jobs:
  test:
    name: Тесты Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тесты (проверка подписи Apple, лимиты, запрос к ИИ)
        working-directory: cloudflare/ai-proxy
        run: npm test

  deploy:
    name: Выпуск в Cloudflare
    needs: test
    # Выпускаем только из main и только если в секретах репозитория есть токен Cloudflare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Выпуск
        working-directory: cloudflare/ai-proxy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Секрет CLOUDFLARE_API_TOKEN не задан: выпуск пропущен. Выпустить вручную: npx wrangler deploy"
            exit 0
          fi
          npm install --no-audit --no-fund
          npx wrangler deploy

      - name: Ключи задач из секретов GitHub
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: cloudflare/ai-proxy
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_CHAT: ${{ secrets.GEMINI_API_KEY_CHAT }}
          GEMINI_API_KEY_QUIZ: ${{ secrets.GEMINI_API_KEY_QUIZ }}
          GEMINI_API_KEY_CONSOLATION: ${{ secrets.GEMINI_API_KEY_CONSOLATION }}
          GEMINI_API_KEY_EXPLAIN: ${{ secrets.GEMINI_API_KEY_EXPLAIN }}
          GEMINI_API_KEY_VERSE: ${{ secrets.GEMINI_API_KEY_VERSE }}
        run: |
          # Только непустые секреты; что в GitHub не задано, в Cloudflare остаётся как есть. Значения в журнал не печатаются
          node -e "import('./scripts/task-secrets.mjs').then((m) => process.stdout.write(JSON.stringify(m.collectTaskSecrets(process.env))))" > "$RUNNER_TEMP/task-secrets.json"
          if [ "$(cat "$RUNNER_TEMP/task-secrets.json")" = "{}" ]; then
            echo "Ключей Gemini в секретах GitHub нет: в Cloudflare остаются заданные там"
          else
            npx wrangler secret bulk "$RUNNER_TEMP/task-secrets.json"
          fi
          rm -f "$RUNNER_TEMP/task-secrets.json"
