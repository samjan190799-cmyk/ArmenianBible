name: AI proxy (Cloudflare Worker)

on:
  push:
    paths:
      - 'cloudflare/ai-proxy/**'
      - '.github/workflows/ai-proxy.yml'

jobs:
  test:
    name: Тесты Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тесты (проверка подписи Apple, лимиты, запрос к ИИ)
        working-directory: cloudflare/ai-proxy
        run: npm test

  deploy:
    name: Выпуск в Cloudflare
    needs: test
    # Выпускаем только из main и только если в секретах репозитория есть токен Cloudflare
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Выпуск
        working-directory: cloudflare/ai-proxy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Секрет CLOUDFLARE_API_TOKEN не задан: выпуск пропущен. Выпустить вручную: npx wrangler deploy"
            exit 0
          fi
          npm install --no-audit --no-fund
          npx wrangler deploy
