name: Build & Deploy to TestFlight

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Сборка и отправка в TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew / XcodeGen
        id: cache-homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/bin/xcodegen
          key: ${{ runner.os }}-homebrew-xcodegen-v4

      - name: Install XcodeGen
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        run: brew update && brew install xcodegen

      - name: Select Latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE="/Applications/Xcode.app"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      # ─── Разворачиваем App Store Connect API Ключ ────────────────
      - name: Setup App Store Connect API Key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_KEY_ID || secrets.KEY_ID || secrets.APPSTORE_KEYID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_ISSUER_ID || secrets.ISSUER_ID || secrets.APPSTORE_ISSUERID }}
          API_KEY_B64: ${{ secrets.APPSTORE_API_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APPSTORE_KEY_BASE64 || secrets.APP_STORE_KEY_BASE64 || secrets.P8_BASE64 || secrets.P8_KEY || secrets.APPSTORE_API_KEY || secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          KEY_ID=$(echo "$KEY_ID" | tr -d '\r\n ')
          ISSUER_ID=$(echo "$ISSUER_ID" | tr -d '\r\n ')

          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$API_KEY_B64" ]; then
            echo "::error::Не все секреты заданы! KEY_ID='$KEY_ID', ISSUER_ID='$ISSUER_ID'"
            exit 1
          fi

          # Нативный путь для Xcode API ключей
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          
          KEY_PATH="$KEY_DIR/AuthKey_${KEY_ID}.p8"
          
          # Декодируем .p8 ключ и ставим строго обязательные права 600
          echo "$API_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          # Записываем в ENV
          echo "APPSTORE_KEY_ID=$KEY_ID" >> $GITHUB_ENV
          echo "APPSTORE_ISSUER_ID=$ISSUER_ID" >> $GITHUB_ENV
          echo "AUTH_KEY_PATH=$KEY_PATH" >> $GITHUB_ENV
          echo "=========================================================="
          echo "🔑 ИСПОЛЬЗУЕМЫЙ KEY ID: $KEY_ID"
          echo "=========================================================="
          echo "✅ API Ключ развёрнут по пути: $KEY_PATH"

      # ─── Временный Keychain для сохранения сертификатов Xcode ─────
      - name: Setup Keychain for Xcode
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KP="ArmenianBibleKeychain2026"

          security create-keychain -p "$KP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KP" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "✅ Временный Keychain настроен"

      # ─── Генерация Xcode Проекта ─────────────────────────────────
      - name: Generate Xcode Project
        run: xcodegen generate

      # ─── Архивация релиза ──────────────────────────────────────────
      - name: Archive Project
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ArmenianBible.xcodeproj \
            -scheme ArmenianBible \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ArmenianBible.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="V7J345DY58" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

          if [ ! -d "$RUNNER_TEMP/ArmenianBible.xcarchive" ]; then
            echo "::error::Архивация не удалась. Лог архивации:"
            tail -50 "$RUNNER_TEMP/archive.log"
            exit 1
          fi
          echo "✅ Архив приложения успешно создан!"

      # ─── Скачивание актуального Provisioning Profile из Apple API ─
      - name: Fetch & Install Provisioning Profile
        run: python3 .github/scripts/fetch_profile.py

      # ─── ExportOptions.plist для App Store Connect (Manual/UUID) ──
      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>V7J345DY58</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.samvel.armenianbible</key>
              <string>${PROVISIONING_PROFILE_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST_EOF

      # ─── Подпись и Экспорт IPA ─────────────────────────────────────
      - name: Export & Sign IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ArmenianBible.xcarchive" \
            -exportPath "$RUNNER_TEMP/Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -allowProvisioningUpdates \
            2>&1 | tee "$RUNNER_TEMP/export.log"

          IPA=$(find "$RUNNER_TEMP/Export" -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::IPA файл не найден. Лог экспорта:"
            tail -50 "$RUNNER_TEMP/export.log"
            exit 1
          fi
          echo "IPA_PATH=$IPA" >> $GITHUB_ENV
          echo "✅ IPA успешно создан и подписан: $IPA"

      # ─── Загрузка IPA в TestFlight ────────────────────────────────
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"

          echo "🚀 Приложение отправлено в TestFlight!"

      # ─── Сохранение готового IPA файла в Артефакты ────────────────
      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArmenianBible-IPA-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          retention-days: 30
