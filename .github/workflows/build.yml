name: Build ArmenianBible iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Upload to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        id: cache-homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
            /opt/homebrew/bin/xcodegen
          key: ${{ runner.os }}-homebrew-xcodegen-v3

      - name: Install XcodeGen
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        run: |
          brew update
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE="/Applications/Xcode.app"
          fi
          echo "Используем: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      # ─── Разворачиваем App Store Connect API ключ ──────────────────
      - name: Setup App Store Connect API Key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          if [ -z "$APPSTORE_KEY_ID" ] || [ -z "$APPSTORE_ISSUER_ID" ] || [ -z "$APPSTORE_API_KEY_BASE64" ]; then
            echo "::error::Отсутствуют секреты APPSTORE_KEY_ID / APPSTORE_ISSUER_ID / APPSTORE_API_KEY_BASE64"
            exit 1
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_KEY_BASE64" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          echo "AUTH_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8" >> $GITHUB_ENV
          echo "APPSTORE_KEY_ID=$APPSTORE_KEY_ID" >> $GITHUB_ENV
          echo "APPSTORE_ISSUER_ID=$APPSTORE_ISSUER_ID" >> $GITHUB_ENV
          echo "✅ App Store Connect API ключ развёрнут"

      # ─── Создаём временный keychain для подписи ────────────────────
      - name: Setup Temporary Keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD="temp_ci_build_password"

          # Создаём keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Делаем его search keychain для xcodebuild
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV
          echo "✅ Временный keychain создан"

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          echo "✅ Xcode проект сгенерирован"

      # ─── Архивация с Automatic Signing (ASC API) ────────────────────
      - name: Archive ArmenianBible
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ArmenianBible.xcodeproj \
            -scheme ArmenianBible \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ArmenianBible.xcarchive" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="V7J345DY58" \
            2>&1 | tee "$RUNNER_TEMP/archive_log.txt"

          if [ ! -d "$RUNNER_TEMP/ArmenianBible.xcarchive" ]; then
            echo "::error::Архив не создан! Лог архивации:"
            cat "$RUNNER_TEMP/archive_log.txt"
            exit 1
          fi
          echo "✅ Архив создан: $RUNNER_TEMP/ArmenianBible.xcarchive"

      # ─── ExportOptions.plist (export локально, не upload) ──────────
      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << 'PLIST_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>V7J345DY58</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          PLIST_EOF
          echo "✅ ExportOptions.plist создан (destination=export)"

      # ─── Шаг 1: Экспорт IPA локально ─────────────────────────────────
      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ArmenianBible.xcarchive" \
            -exportPath "$RUNNER_TEMP/Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            -allowProvisioningUpdates \
            2>&1 | tee "$RUNNER_TEMP/export_log.txt"

          IPA_PATH=$(find "$RUNNER_TEMP/Export" -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::IPA не найден! Лог экспорта:"
            cat "$RUNNER_TEMP/export_log.txt"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV
          echo "✅ IPA создан: $IPA_PATH"

      # ─── Шаг 2: Загрузка IPA в TestFlight через xcrun altool ─────────
      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload_log.txt"

          if grep -q "No errors uploading" "$RUNNER_TEMP/upload_log.txt"; then
            echo "✅ Приложение успешно загружено в TestFlight!"
          else
            echo "::warning::Проверь лог загрузки:"
            cat "$RUNNER_TEMP/upload_log.txt"
          fi

      # ─── Сохраняем IPA как артефакт ────────────────────────────────
      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmenianBible-IPA-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          if-no-files-found: warn
          retention-days: 30

      # ─── GitHub Release (только main при push) ──────────────────────
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Armenian Bible v1.0 (Сборка ${{ github.run_number }})"
          body: |
            ## 📖 Armenian Bible — Армянская Библия

            **Как установить через AltStore:**
            1. Скачайте файл `ArmenianBible.ipa` ниже
            2. Откройте AltStore на iPhone → "My Apps" → "+" → выберите скачанный IPA
            3. Готово!

            ---
            Собрано автоматически через GitHub Actions | Сборка №${{ github.run_number }}
          files: ${{ env.IPA_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
