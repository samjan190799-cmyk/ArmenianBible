name: Build & Deploy to TestFlight

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Сборка и отправка в TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew / XcodeGen
        id: cache-homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/bin/xcodegen
          key: ${{ runner.os }}-homebrew-xcodegen-v4

      - name: Install XcodeGen
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        run: brew update && brew install xcodegen

      - name: Select Latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE="/Applications/Xcode.app"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate Certificate and Provisioning Profile
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_KEY_ID || secrets.KEY_ID || secrets.APPSTORE_KEYID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_ISSUER_ID || secrets.ISSUER_ID || secrets.APPSTORE_ISSUERID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APPSTORE_KEY_BASE64 || secrets.APP_STORE_KEY_BASE64 || secrets.P8_BASE64 || secrets.P8_KEY || secrets.APPSTORE_API_KEY || secrets.APPSTORE_PRIVATE_KEY }}
        run: python3 .github/scripts/generate_certs.py

      - name: Install Certificate into Keychain
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KP="ArmenianBibleKeychain2026"

          security create-keychain -p "$KP" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KP" "$KEYCHAIN_PATH"

          security import "$DIST_P12_PATH" \
            -P "$DIST_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KP" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision

          echo "PROVISIONING_PROFILE_UUID=$PP_UUID" >> $GITHUB_ENV
          echo "Установлен UUID профиля: $PP_UUID"

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ArmenianBible.xcodeproj \
            -scheme ArmenianBible \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ArmenianBible.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="V7J345DY58" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

          if [ ! -d "$RUNNER_TEMP/ArmenianBible.xcarchive" ]; then
            echo "::error::Архивация не удалась. Последние строки лога:"
            tail -50 "$RUNNER_TEMP/archive.log"
            exit 1
          fi
          echo "Архив создан успешно"

      - name: Create ExportOptions.plist
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>V7J345DY58</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.samvel.armenianbible</key>
              <string>${PROVISIONING_PROFILE_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST_EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ArmenianBible.xcarchive" \
            -exportPath "$RUNNER_TEMP/Export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee "$RUNNER_TEMP/export.log"

          IPA=$(find "$RUNNER_TEMP/Export" -name "*.ipa" | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::IPA не найден. Лог:"
            tail -30 "$RUNNER_TEMP/export.log"
            exit 1
          fi
          echo "IPA_PATH=$IPA" >> $GITHUB_ENV
          echo "IPA создан: $IPA"

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --apiKeyPath "$AUTH_KEY_PATH" \
            2>&1
          echo "Отправлено в TestFlight!"

      - name: Save Signing Secrets as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-signing-secrets-${{ github.run_number }}
          path: ${{ runner.temp }}/secrets_output/
          retention-days: 3
          if-no-files-found: warn

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ArmenianBible-IPA-${{ github.run_number }}
          path: ${{ env.IPA_PATH }}
          retention-days: 30
