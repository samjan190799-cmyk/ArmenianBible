name: Build ArmenianBible iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        id: cache-homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
            /opt/homebrew/bin/xcodegen
          key: ${{ runner.os }}-homebrew-xcodegen

      - name: Install XcodeGen
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        run: |
          brew update
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install iOS Certificate and Provisioning Profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          WIDGET_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Пути для временных файлов подписи
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          WIDGET_PP_PATH=$RUNNER_TEMP/widget_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Декодируем данные из секретов GitHub
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
          echo -n "$WIDGET_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $WIDGET_PP_PATH

          # Создаем временную связку ключей (keychain)
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          # Импортируем p12 сертификат
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Создаем системную директорию профилей Xcode
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Извлекаем UUID каждого профиля и копируем их под правильными именами
          MAIN_UUID=$(security cms -D -i $PP_PATH | plutil -extract UUID raw -)
          WIDGET_UUID=$(security cms -D -i $WIDGET_PP_PATH | plutil -extract UUID raw -)

          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$MAIN_UUID.mobileprovision
          cp $WIDGET_PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$WIDGET_UUID.mobileprovision

          echo "Подпись успешно импортирована!"

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build for iOS Device (Signed)
        run: |
          xcodebuild \
            -project ArmenianBible.xcodeproj \
            -scheme ArmenianBible \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            build

          # Проверка бинарного файла приложения
          ls -l build/Build/Products/Release-iphoneos/ArmenianBible.app/ArmenianBible

      - name: Package as IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          echo "App path: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/ArmenianBible.app
          cd build
          zip -r ArmenianBible.ipa Payload/
          echo "IPA size: $(du -h ArmenianBible.ipa | cut -f1)"
      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArmenianBible-IPA
          path: build/ArmenianBible.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Armenian Bible LockScreen v1.0 (Сборка ${{ github.run_number }})"
          body: |
            ## Armenian Bible LockScreen IPA (Աստվածաշունչ Կողպման Էկրանին)

            **Ինչպես տեղադրել AltStore-ի միջոցով / Как установить через AltStore:**
            1. Ներբեռնեք ներքևում գտնվող `ArmenianBible.ipa` ֆայլը: (Скачайте файл `ArmenianBible.ipa` ниже.)
            2. Բացեք AltStore-ը ձեր iPhone-ում → "My Apps" → "+" → ընտրեք ներբեռնված IPA ֆայլը: (Откройте AltStore на iPhone → "My Apps" → "+" → выберите скачанный IPA.)
            3. Պատրաստ է: (Готово!)

            **Փոփոхоություններ / Изменения:**
            - Первоначальный релиз приложения на армянском языке с виджетом для экрана блокировки.
          files: build/ArmenianBible.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
