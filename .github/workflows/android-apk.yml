name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ['feat/settings-groups']
    paths:
      - 'android_app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    name: Сборка APK (release, подпись отладочным ключом — ставится на любой телефон напрямую)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Список собранных файлов
        run: ls -la app/build/outputs/apk/release/

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: Luys-Android-APK
          path: android_app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
