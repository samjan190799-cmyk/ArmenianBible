name: Android APK

on:
  workflow_dispatch:
  push:
    branches: ['feat/settings-groups']
    paths:
      - 'android_app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    name: Сборка APK (release, подпись отладочным ключом — ставится на любой телефон напрямую)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Сборка release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Список собранных файлов
        run: ls -la app/build/outputs/apk/release/

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: Luys-Android-APK
          path: android_app/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  smoke:
    name: Проверка в эмуляторе (запуск, четыре вкладки, снимки экрана, поиск сбоев)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Скачать APK
        uses: actions/download-artifact@v4
        with:
          name: Luys-Android-APK
          path: apk

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Эмулятор и тест
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android_app/ci/smoke.sh

      - name: Загрузка снимков
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Luys-Android-Smoke
          path: smoke/*
          if-no-files-found: warn
