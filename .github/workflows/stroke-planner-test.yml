name: Stroke Planner Test

# Запускает настоящий Swift-код планировщика письма пером на шрифте приложения.
# В TestFlight ничего не отправляет: запускается на пуш в feat/** и вручную.
on:
  push:
    branches: [ "feat/**" ]
    paths:
      - "Sources/ManuscriptStrokePlanner.swift"
      - "Tools/StrokePlannerTest/**"
      - ".github/workflows/stroke-planner-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planner:
    name: Планировщик письма (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Компиляция
        run: |
          swiftc -O Sources/ManuscriptStrokePlanner.swift Tools/StrokePlannerTest/main.swift -o stroke_test

      - name: Запуск
        run: |
          ./stroke_test Sources/Fonts/NotoSerifArmenian-Regular.ttf
