name: Deploy ArmenianBible to App Store Connect / TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    name: Build Sign Upload ArmenianBible to TestFlight
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Homebrew
        id: cache-homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar
            /opt/homebrew/bin/xcodegen
          key: ${{ runner.os }}-homebrew-xcodegen

      - name: Install XcodeGen
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        run: |
          brew update
          brew install xcodegen

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Using Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Import Distribution Certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "Certificate imported:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install Provisioning Profiles
        env:
          MAIN_PROFILE_BASE64: ${{ secrets.MAIN_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          echo "$MAIN_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/main.mobileprovision"
          MAIN_UUID=$(python3 -c "
import plistlib, sys
with open('$RUNNER_TEMP/main.mobileprovision', 'rb') as f:
    content = f.read()
start = content.find(b'<?xml')
end = content.find(b'</plist>') + 8
plist = plistlib.loads(content[start:end])
print(plist['UUID'])
")
          cp "$RUNNER_TEMP/main.mobileprovision" "$PP_DIR/${MAIN_UUID}.mobileprovision"
          echo "Main profile UUID: $MAIN_UUID"
          echo "$WIDGET_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/widget.mobileprovision"
          WIDGET_UUID=$(python3 -c "
import plistlib, sys
with open('$RUNNER_TEMP/widget.mobileprovision', 'rb') as f:
    content = f.read()
start = content.find(b'<?xml')
end = content.find(b'</plist>') + 8
plist = plistlib.loads(content[start:end])
print(plist['UUID'])
")
          cp "$RUNNER_TEMP/widget.mobileprovision" "$PP_DIR/${WIDGET_UUID}.mobileprovision"
          echo "Widget profile UUID: $WIDGET_UUID"

      - name: Setup App Store Connect Auth
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_KEY_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          echo "App Store Connect key installed!"

      - name: Build and Archive ArmenianBible
        run: |
          set -o pipefail
          cat > /tmp/ExportOptions.plist << 'PLISTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>V7J345DY58</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.samvel.armenianbible</key>
              <string>Samvel_Main_App_Profile</string>
              <key>com.samvel.armenianbible.BibleWidget</key>
              <string>Samvel_Widget_Profile</string>
            </dict>
          </dict>
          </plist>
          PLISTEOF
          xcodebuild archive \
            -project ArmenianBible.xcodeproj \
            -scheme ArmenianBible \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/ArmenianBible.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=V7J345DY58 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Samvel_Main_App_Profile" \
            2>&1 | tee build_log.txt
          echo "Archive created!"

      - name: Export Signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ArmenianBible.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            2>&1
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "IPA: $IPA_PATH ($(du -h "$IPA_PATH" | cut -f1))"
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" \
            --verbose
          echo "Uploaded to TestFlight!"

      - name: Cleanup Keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
