name: Deploy ArmenianBible to TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  deploy:
    name: Build Sign Upload to TestFlight
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Generate Project
        run: xcodegen generate

      - name: Import Certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KCHAIN=$RUNNER_TEMP/signing.keychain-db
          KPASS=$(openssl rand -hex 16)
          security create-keychain -p "$KPASS" "$KCHAIN"
          security set-keychain-settings -lut 21600 "$KCHAIN"
          security unlock-keychain -p "$KPASS" "$KCHAIN"
          echo "$DIST_CERT_P12_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k "$KCHAIN" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KCHAIN"
          security find-identity -v -p codesigning "$KCHAIN"

      - name: Install Profiles
        env:
          MAIN_PROFILE_BASE64: ${{ secrets.MAIN_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WIDGET_PROFILE_BASE64 }}
        run: |
          PPDIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PPDIR"
          echo "$MAIN_PROFILE_BASE64" | base64 -d > $RUNNER_TEMP/main.mobileprovision
          MUUID=$(python3 -c "
import plistlib
with open('$RUNNER_TEMP/main.mobileprovision','rb') as f:
    c=f.read()
s=c.find(b'<?xml');e=c.find(b'</plist>')+8
print(plistlib.loads(c[s:e])['UUID'])
")
          cp $RUNNER_TEMP/main.mobileprovision "$PPDIR/$MUUID.mobileprovision"
          echo "Main UUID: $MUUID"
          echo "$WIDGET_PROFILE_BASE64" | base64 -d > $RUNNER_TEMP/widget.mobileprovision
          WUUID=$(python3 -c "
import plistlib
with open('$RUNNER_TEMP/widget.mobileprovision','rb') as f:
    c=f.read()
s=c.find(b'<?xml');e=c.find(b'</plist>')+8
print(plistlib.loads(c[s:e])['UUID'])
")
          cp $RUNNER_TEMP/widget.mobileprovision "$PPDIR/$WUUID.mobileprovision"
          echo "Widget UUID: $WUUID"

      - name: Setup ASC Auth
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_KEY_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ArmenianBible.xcodeproj \
            -scheme ArmenianBible \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath $RUNNER_TEMP/AB.xcarchive \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=V7J345DY58 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Samvel_Main_App_Profile" \
            2>&1 | tail -50

      - name: Create ExportOptions
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>V7J345DY58</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>com.samvel.armenianbible</key><string>Samvel_Main_App_Profile</string>
              <key>com.samvel.armenianbible.BibleWidget</key><string>Samvel_Widget_Profile</string>
            </dict>
          </dict></plist>
          EOF

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AB.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist
          IPA=$(find $RUNNER_TEMP/export -name '*.ipa' | head -1)
          echo "IPA_PATH=$IPA" >> $GITHUB_ENV
          echo "IPA: $IPA"

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "$IPA_PATH" -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" --verbose

      - name: Cleanup
        if: always()
        run: security delete-keychain $RUNNER_TEMP/signing.keychain-db 2>/dev/null || true
