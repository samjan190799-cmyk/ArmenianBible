name: AB Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Sign and Upload ArmenianBible to TestFlight
    runs-on: macos-15
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          if [ -d "/Applications/Xcode_26.0.app" ]; then
            XCODE_PATH="/Applications/Xcode_26.0.app"
          elif [ -d "/Applications/Xcode_26.app" ]; then
            XCODE_PATH="/Applications/Xcode_26.app"
          fi
          echo "Selected Xcode: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Generate Project
        run: xcodegen generate

      - name: Import Certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          KCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPASS=$(openssl rand -hex 16)
          security create-keychain -p "$KPASS" "$KCHAIN"
          security set-keychain-settings -lut 21600 "$KCHAIN"
          security unlock-keychain -p "$KPASS" "$KCHAIN"
          echo "$DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KCHAIN" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPASS" "$KCHAIN"
          security find-identity -v -p codesigning "$KCHAIN"
          echo "KCHAIN=$KCHAIN" >> $GITHUB_ENV

      - name: Install Profile
        env:
          MAIN_PROFILE_BASE64: ${{ secrets.MAIN_PROFILE_BASE64 }}
        run: |
          PPDIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PPDIR"
          echo "$MAIN_PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/main.mobileprovision"
          MUUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< $(security cms -D -i "$RUNNER_TEMP/main.mobileprovision"))
          cp "$RUNNER_TEMP/main.mobileprovision" "$PPDIR/$MUUID.mobileprovision"
          echo "Main UUID: $MUUID"

      - name: Setup ASC Key
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_API_KEY_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          echo "ASC key installed"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ArmenianBible.xcodeproj \
            -scheme ArmenianBible \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=V7J345DY58 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="Samvel_App_Profile" \
            -archivePath "$RUNNER_TEMP/AB.xcarchive" 2>&1 | tail -80
          echo "Archive complete!"

      - name: Write ExportOptions
        run: |
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          echo '<?xml version="1.0" encoding="UTF-8"?>' > "$PLIST"
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> "$PLIST"
          echo '<plist version="1.0"><dict>' >> "$PLIST"
          echo '  <key>method</key><string>app-store-connect</string>' >> "$PLIST"
          echo '  <key>teamID</key><string>V7J345DY58</string>' >> "$PLIST"
          echo '  <key>signingStyle</key><string>manual</string>' >> "$PLIST"
          echo '  <key>uploadSymbols</key><true/>' >> "$PLIST"
          echo '  <key>provisioningProfiles</key><dict>' >> "$PLIST"
          echo '    <key>com.samvel.armenianbible</key><string>Samvel_App_Profile</string>' >> "$PLIST"
          echo '  </dict>' >> "$PLIST"
          echo '</dict></plist>' >> "$PLIST"
          cat "$PLIST"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AB.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "IPA_PATH=$IPA" >> $GITHUB_ENV
          du -h "$IPA"

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -o pipefail
          xcrun altool --upload-app \
            -f "$IPA_PATH" -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" --verbose

      - name: Cleanup
        if: always()
        run: security delete-keychain "$KCHAIN" 2>/dev/null || true
