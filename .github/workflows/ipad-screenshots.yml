name: Capture Native iPad Screenshots

on:
  workflow_dispatch:

jobs:
  capture-ipad-screenshots:
    name: Снятие нативных скриншотов с iPad Pro Simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Homebrew / XcodeGen
        id: cache-homebrew
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/bin/xcodegen
          key: ${{ runner.os }}-homebrew-xcodegen-v4

      - name: Install XcodeGen
        if: steps.cache-homebrew.outputs.cache-hit != 'true'
        run: brew update && brew install xcodegen

      - name: Select Latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XCODE" ] && XCODE="/Applications/Xcode.app"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Find and Boot 13-inch iPad Simulator
        id: sim-setup
        run: |
          echo "Ищем подходящий симулятор iPad Pro 13 / 12.9 дюймов..."
          DEVICE_LINE=$(xcrun simctl list devices available | grep -iE "iPad Pro 13|iPad Pro \(12.9-inch\)" | head -1)
          if [ -z "$DEVICE_LINE" ]; then
            DEVICE_LINE=$(xcrun simctl list devices available | grep -iE "iPad" | head -1)
          fi
          
          DEVICE_UDID=$(echo "$DEVICE_LINE" | grep -oE "\([A-F0-9-]{36}\)" | tr -d '()')
          echo "Выбран симулятор: $DEVICE_LINE (UDID: $DEVICE_UDID)"
          echo "udid=$DEVICE_UDID" >> $GITHUB_OUTPUT
          
          # Загружаем симулятор
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Build App for Simulator
        env:
          UDID: ${{ steps.sim-setup.outputs.udid }}
        run: |
          xcodebuild build \
            -project ArmenianBible.xcodeproj \
            -scheme ArmenianBible \
            -destination "id=$UDID" \
            -configuration Debug \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Install & Launch App on Simulator
        env:
          UDID: ${{ steps.sim-setup.outputs.udid }}
        run: |
          APP_PATH=$(find ./DerivedData -name "ArmenianBible.app" | head -1)
          echo "Путь к приложению: $APP_PATH"
          # Удаляем appex расширение перед установкой в симулятор во избежание ошибки IXErrorDomain
          rm -rf "$APP_PATH/PlugIns"
          xcrun simctl install "$UDID" "$APP_PATH"
          
          # Настройка симулятора: скрываем экранную клавиатуру и ставим идеальный статус-бар Apple
          xcrun simctl spawn "$UDID" defaults write com.apple.Preferences ConnectHardwareKeyboard -bool true || true
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          
          # Запрещаем показ любых диалогов разрешений (ATT, Photos и т.д.)
          xcrun simctl privacy "$UDID" deny user-tracking com.samvel.armenianbible || true
          xcrun simctl privacy "$UDID" grant photos com.samvel.armenianbible || true
          
          # Прогрев первого запуска приложения (чтобы экран загрузки успел пройти)
          echo "Прогрев первого запуска..."
          xcrun simctl launch "$UDID" com.samvel.armenianbible
          sleep 10
          xcrun simctl terminate "$UDID" com.samvel.armenianbible
          sleep 2
          
          mkdir -p ./Screenshots_iPad_Native
          
          # 0. Экран блокировки со стихами и виджетами (Lock Screen)
          echo "Снятие 00 Lock Screen..."
          xcrun simctl launch "$UDID" com.samvel.armenianbible -openTab lockscreen
          sleep 6
          xcrun simctl io "$UDID" screenshot ./Screenshots_iPad_Native/00_Native_iPad_LockScreen.png
          xcrun simctl terminate "$UDID" com.samvel.armenianbible
          sleep 2
          
          # 1. Главный экран со стихом дня (Home)
          echo "Снятие 01 Home..."
          xcrun simctl launch "$UDID" com.samvel.armenianbible -openTab home
          sleep 6
          xcrun simctl io "$UDID" screenshot ./Screenshots_iPad_Native/01_Native_iPad_Home.png
          xcrun simctl terminate "$UDID" com.samvel.armenianbible
          sleep 2
          
          # 2. Вкладка Избранное (Favorites)
          echo "Снятие 02 Favorites..."
          xcrun simctl launch "$UDID" com.samvel.armenianbible -openTab favorites
          sleep 5
          xcrun simctl io "$UDID" screenshot ./Screenshots_iPad_Native/02_Native_iPad_Favorites.png
          xcrun simctl terminate "$UDID" com.samvel.armenianbible
          sleep 2
          
          # 3. Вкладка Библия / Чтение (Bible Reader)
          echo "Снятие 03 Bible Reader..."
          xcrun simctl launch "$UDID" com.samvel.armenianbible -openTab bible
          sleep 5
          xcrun simctl io "$UDID" screenshot ./Screenshots_iPad_Native/03_Native_iPad_BibleReader.png
          xcrun simctl terminate "$UDID" com.samvel.armenianbible
          sleep 2
          
          # 4. Экран Церковного календаря (Calendar)
          echo "Снятие 04 Calendar..."
          xcrun simctl launch "$UDID" com.samvel.armenianbible -openTab calendar
          sleep 5
          xcrun simctl io "$UDID" screenshot ./Screenshots_iPad_Native/04_Native_iPad_Calendar.png
          xcrun simctl terminate "$UDID" com.samvel.armenianbible
          sleep 2

          # 5. Экран Библейской викторины (Quiz)
          echo "Снятие 05 Quiz..."
          xcrun simctl launch "$UDID" com.samvel.armenianbible -openTab quiz
          sleep 5
          xcrun simctl io "$UDID" screenshot ./Screenshots_iPad_Native/05_Native_iPad_Quiz.png
          xcrun simctl terminate "$UDID" com.samvel.armenianbible

      - name: Upload Native iPad Screenshots Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Native-iPad-Pro-Screenshots
          path: ./Screenshots_iPad_Native/*.png
          if-no-files-found: warn
