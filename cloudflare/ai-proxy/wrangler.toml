name = "luys-ai"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Настройки без секретов. Ключ ИИ сюда не кладём: он задаётся командой `wrangler secret put GEMINI_API_KEY`
[vars]
BUNDLE_ID = "com.samvel.armenianbible"
PRODUCT_IDS = "com.samvel.armenianbible.subscription.monthly,com.samvel.armenianbible.subscription.yearly"
# Сколько запросов к ИИ в сутки (по UTC) у одного подписчика и у всего сервиса вместе (потолок расходов)
DAILY_LIMIT = "30"
GLOBAL_DAILY_LIMIT = "3000"
# Бесплатные вопросы (без подписки). Приложение разрешает 3 в сутки по местному времени, здесь запас на границу суток по UTC.
# FREE_DAILY_LIMIT: на одну установку; FREE_NET_DAILY_LIMIT: на одну сеть (против переустановок);
# FREE_GLOBAL_DAILY_LIMIT: на всех бесплатных вместе (потолок расходов). ALLOW_FREE = "false" выключает бесплатный путь
ALLOW_FREE = "true"
FREE_DAILY_LIMIT = "5"
FREE_NET_DAILY_LIMIT = "15"
FREE_GLOBAL_DAILY_LIMIT = "300"
# Подписки из TestFlight и проверяющих Apple приходят как Sandbox. Оставляем "true" и после выпуска: песочную подписку подделать нельзя
# (нужна подпись Apple и аккаунт из вашего App Store Connect), а с "false" ИИ не заработает на проверке следующих версий
ALLOW_SANDBOX = "true"
# Модели Gemini для вопросов через сервер, по порядку: если первая недоступна, пробуется следующая.
# Сверено с документацией Google 2026-11-05: gemini-2.0-flash закрыта, gemini-2.5-flash с 1 декабря 2026 уходит на gemini-3.5-flash-lite.
# Хотите качество выше, а расход больше: поставьте gemini-3.6-flash первой
GEMINI_MODELS = "gemini-3.5-flash-lite,gemini-3.6-flash,gemini-2.5-flash-lite"
# Задачи ИИ (chat, quiz, consolation, explain, verse): для каждой можно задать свой ключ Gemini, свои модели и суточный потолок.
#   секрет:      npx wrangler secret put GEMINI_API_KEY_CHAT   (так же _QUIZ, _CONSOLATION, _EXPLAIN, _VERSE)
#   или в секретах GitHub под теми же именами: при выпуске из main их передаёт Worker .github/workflows/ai-proxy.yml
#   переменные:  GEMINI_MODELS_CHAT = "..."  (свой список моделей),  TASK_DAILY_LIMIT_QUIZ = "200"  (запросов в сутки по UTC на всех вместе)
# Что не задано, берётся общее (GEMINI_API_KEY, GEMINI_MODELS), а потолка у задачи нет. Подробности: src/tasks.js
# Список моделей для кнопки «Обновить модели» в приложении (GET /v1/models) лежит в src/models.js.
# Заменить его без правки кода можно переменной AI_MODEL_CATALOG (JSON вида {"gemini":[...],"openai":[...],"claude":[...]})

# Счётчики вопросов: по одному объекту на подписчика и один общий
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

# Воронка: счётчики событий приложения (анонимные), читаются на странице /dashboard по токену STATS_TOKEN
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]
