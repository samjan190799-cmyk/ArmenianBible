name = "luys-ai"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Настройки без секретов. Ключ ИИ сюда не кладём: он задаётся командой `wrangler secret put GEMINI_API_KEY`
[vars]
BUNDLE_ID = "com.samvel.armenianbible"
PRODUCT_IDS = "com.samvel.armenianbible.subscription.monthly,com.samvel.armenianbible.subscription.yearly"
# Сколько запросов к ИИ в сутки (по UTC) у одного подписчика и у всего сервиса вместе (потолок расходов)
DAILY_LIMIT = "30"
GLOBAL_DAILY_LIMIT = "3000"
# Бесплатные вопросы (без подписки). Приложение разрешает 3 в сутки по местному времени, здесь запас на границу суток по UTC.
# FREE_DAILY_LIMIT: на одну установку; FREE_NET_DAILY_LIMIT: на одну сеть (против переустановок);
# FREE_GLOBAL_DAILY_LIMIT: на всех бесплатных вместе (потолок расходов). ALLOW_FREE = "false" выключает бесплатный путь
ALLOW_FREE = "true"
FREE_DAILY_LIMIT = "5"
FREE_NET_DAILY_LIMIT = "15"
FREE_GLOBAL_DAILY_LIMIT = "300"
# Подписки из TestFlight приходят как Sandbox. После выпуска в App Store можно поставить "false"
ALLOW_SANDBOX = "true"
# Модели Gemini по порядку: если первая недоступна, пробуется следующая
GEMINI_MODELS = "gemini-2.5-flash,gemini-2.0-flash"

# Счётчики вопросов: по одному объекту на подписчика и один общий
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

# Воронка: счётчики событий приложения (анонимные), читаются на странице /dashboard по токену STATS_TOKEN
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Stats"]
