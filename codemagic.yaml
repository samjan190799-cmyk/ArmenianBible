workflows:
  ios-release:
    name: Build & Deploy to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: App Store Connect # Имя интеграции в UI Codemagic
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.samvel.armenianbible
    scripts:
      - name: Install XcodeGen & Generate Project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Automatic code signing
        script: |
          # ⚠️ Важно: подтягивает профили подписи от Apple перед сборкой
          xcode-project use-profiles
      - name: Increment build number
        script: |
          # ⚠️ Важно: увеличивает номер сборки, чтобы Apple приняла новый билд
          agvtool new-version -all $BUILD_NUMBER
      - name: Build IPA
        script: |
          # ⚠️ Сборка готового .ipa файла для загрузки в App Store
          xcode-project build-ipa \
            --project ArmenianBible.xcodeproj \
            --scheme ArmenianBible
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
