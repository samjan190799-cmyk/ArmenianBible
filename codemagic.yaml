workflows:
  ios-release:
    name: Build & Deploy to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: App Store Connect # Название интеграции в UI Codemagic
    environment:
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store # Тип подписи: app_store, ad_hoc или development
        bundle_identifier: com.samvel.armenianbible
    scripts:
      - name: Install XcodeGen & Generate Project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build iOS App
        script: |
          xcode-project build-ipa \
            --project "ArmenianBible.xcodeproj" \
            --scheme "ArmenianBible"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
