workflows:
  ios-release:
    name: Build & Deploy to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install XcodeGen & Generate Project
        script: |
          brew install xcodegen
          xcodegen generate
      - name: Build Archive
        script: |
          xcodebuild archive \
            -project ArmenianBible.xcodeproj \
            -scheme ArmenianBible \
            -destination 'generic/platform=iOS' \
            -archivePath build/ArmenianBible.xcarchive
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
