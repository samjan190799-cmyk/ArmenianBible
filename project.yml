name: ArmenianBible
options:
  bundleIdPrefix: com.samvel.armenianbible
targets:
  ArmenianBible:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: ArmenianBible
        CFBundleDisplayName: ArmenianBible
        CFBundleIdentifier: com.samvel.armenianbible
        CFBundleVersion: "${BUILD_NUMBER:1}"
        CFBundleShortVersionString: "4.1"
        CFBundlePackageType: APPL
        CFBundleExecutable: ArmenianBible
        ITSAppUsesNonExemptEncryption: "NO"
        NSPhotoLibraryAddUsageDescription: "We need permission to save generated Bible verse wallpapers to your Photos library."
        NSPhotoLibraryUsageDescription: "We need permission to save generated Bible verse wallpapers to your Photos library."
        NSFaceIDUsageDescription: "Protect your personal bookmarks, prayer journal, and notes with Face ID."
        NSLocationWhenInUseUsageDescription: "Геолокация нужна только чтобы показать расстояние до монастырей и храмов на карте святынь. Она обрабатывается на устройстве и никуда не отправляется."
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - NotoSerifArmenian-Regular.ttf
          - NotoSerifArmenian-Medium.ttf
          - NotoSerifArmenian-SemiBold.ttf
        UIRequiresFullScreen: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchImage
          UIImageRespectsSafetyMargins: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    entitlements:
      path: Sources/ArmenianBible.entitlements
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: ArmenianBible
        PRODUCT_BUNDLE_IDENTIFIER: com.samvel.armenianbible
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: "V7J345DY58"
        CODE_SIGN_STYLE: "Automatic"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_PRIMARY_APPICON_SET_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-PitchBlack AppIcon-GoldenGlow AppIcon-RoyalIndigo AppIcon-RoyalPomegranate AppIcon-SacredEmerald AppIcon-SnowWhite AppIcon-Manuscript AppIcon-Codex AppIcon-Classic"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - target: BibleWidget
      - sdk: libsqlite3.dylib
      - sdk: libxml2.tbd
      - sdk: libz.tbd

  BibleWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
      - path: Sources/BibleVerse.swift
      - path: Sources/BibleModels.swift
      - path: Sources/AppGroupConstants.swift
      - path: Sources/AppTypes.swift
      - path: Sources/WidgetTypes.swift
      - path: Sources/BibleVerseDatabase+Main.swift
      - path: Sources/BibleVerseDatabase.swift
      - path: Sources/BibleVerseDatabase+Faith.swift
      - path: Sources/BibleVerseDatabase+Faith2.swift
      - path: Sources/BibleVerseDatabase+Filter.swift
      - path: Sources/BibleVerseDatabase+Prayers.swift
      - path: Sources/BibleVerseDatabase+Library.swift
      - path: Sources/BibleVerseDatabase+NarekInspired.swift
      - path: Sources/WidgetPosterStyle.swift
      - path: Sources/QuoteTier.swift
      - path: Sources/LockScreenQuoteViews.swift
      - path: Sources/PrayerCandleModels.swift
      - path: Sources/CandleRenderer.swift
      - path: Sources/CandleActivityAttributes.swift
      - path: Sources/CandleIslandViews.swift
      - path: Sources/en.lproj
      - path: Sources/ru.lproj
      - path: Sources/hy.lproj
      - path: Sources/Fonts
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: BibleWidget
        CFBundleDisplayName: BibleWidget
        CFBundleIdentifier: com.samvel.armenianbible.BibleWidget
        CFBundleVersion: "${BUILD_NUMBER:1}"
        CFBundleShortVersionString: "4.1"
        CFBundlePackageType: XPC!
        CFBundleExecutable: BibleWidget
        UIAppFonts:
          - NotoSerifArmenian-Regular.ttf
          - NotoSerifArmenian-Medium.ttf
          - NotoSerifArmenian-SemiBold.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/BibleWidget.entitlements
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: BibleWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.samvel.armenianbible.BibleWidget
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: "V7J345DY58"
        CODE_SIGN_STYLE: "Automatic"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
