name: ArmenianBible
options:
  bundleIdPrefix: com.samvel.armenianbible
packages:
  MyTargetSDK:
    url: https://github.com/myTargetSDK/mytarget-ios-spm
    from: 5.46.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.2.0


targets:
  ArmenianBible:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: ArmenianBible
        CFBundleDisplayName: ArmenianBible
        CFBundleIdentifier: com.samvel.armenianbible
        CFBundleVersion: "${BUILD_NUMBER:1}"
        CFBundleShortVersionString: "3.6"
        CFBundlePackageType: APPL
        CFBundleExecutable: ArmenianBible
        ITSAppUsesNonExemptEncryption: "NO"
        GADApplicationIdentifier: "ca-app-pub-2894315025786699~1008604498"
        NSPhotoLibraryAddUsageDescription: "We need permission to save generated Bible verse wallpapers to your Photos library."
        NSPhotoLibraryUsageDescription: "We need permission to save generated Bible verse wallpapers to your Photos library."
        NSFaceIDUsageDescription: "Protect your personal bookmarks, prayer journal, and notes with Face ID."
        NSUserTrackingUsageDescription: "Разрешите отслеживание для персонализации рекомендаций и полезных предложений"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: 5a6flpkh64.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych544.skadnetwork
          - SKAdNetworkIdentifier: c6kgnbxtmg.skadnetwork
          - SKAdNetworkIdentifier: zq492l623r.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 446h53uz2q.skadnetwork
          - SKAdNetworkIdentifier: 4pfyvq9l8r.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhm4fac.skadnetwork
          - SKAdNetworkIdentifier: tl5878mr92.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
        UIBackgroundModes:
          - audio
        UIAppFonts:
          - NotoSerifArmenian-Regular.ttf
          - NotoSerifArmenian-Medium.ttf
          - NotoSerifArmenian-SemiBold.ttf
        UIRequiresFullScreen: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchImage
          UIImageRespectsSafetyMargins: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    entitlements:
      path: Sources/ArmenianBible.entitlements
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: ArmenianBible
        PRODUCT_BUNDLE_IDENTIFIER: com.samvel.armenianbible
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: "V7J345DY58"
        CODE_SIGN_STYLE: "Automatic"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_PRIMARY_APPICON_SET_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-PitchBlack AppIcon-GoldenGlow AppIcon-RoyalIndigo AppIcon-RoyalPomegranate AppIcon-SacredEmerald AppIcon-SnowWhite"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ObjC"
    dependencies:
      - package: MyTargetSDK
        product: MyTargetSDK
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - sdk: AppTrackingTransparency.framework
      - sdk: AdSupport.framework
      - target: BibleWidget
      - sdk: libsqlite3.dylib
      - sdk: libxml2.tbd
      - sdk: libz.tbd

  BibleWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
      - path: Sources/BibleVerse.swift
      - path: Sources/BibleModels.swift
      - path: Sources/AppGroupConstants.swift
      - path: Sources/AppTypes.swift
      - path: Sources/WidgetTypes.swift
      - path: Sources/BibleVerseDatabase+Main.swift
      - path: Sources/BibleVerseDatabase.swift
      - path: Sources/BibleVerseDatabase+Faith.swift
      - path: Sources/BibleVerseDatabase+Faith2.swift
      - path: Sources/BibleVerseDatabase+Filter.swift
      - path: Sources/PrayerCandleModels.swift
      - path: Sources/en.lproj
      - path: Sources/ru.lproj
      - path: Sources/hy.lproj
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: BibleWidget
        CFBundleDisplayName: BibleWidget
        CFBundleIdentifier: com.samvel.armenianbible.BibleWidget
        CFBundleVersion: "${BUILD_NUMBER:1}"
        CFBundleShortVersionString: "3.6"
        CFBundlePackageType: XPC!
        CFBundleExecutable: BibleWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/BibleWidget.entitlements
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: BibleWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.samvel.armenianbible.BibleWidget
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: "V7J345DY58"
        CODE_SIGN_STYLE: "Automatic"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
