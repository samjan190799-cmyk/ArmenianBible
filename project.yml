name: ArmenianBible
options:
  bundleIdPrefix: com.samvel.armenianbible
targets:
  ArmenianBible:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: ArmenianBible
        CFBundleDisplayName: ArmenianBible
        CFBundleIdentifier: com.samvel.armenianbible
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: ArmenianBible
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: ArmenianBible
        CODE_SIGN_ENTITLEMENTS: Sources/ArmenianBible.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_PRIMARY_APPICON_SET_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
    dependencies:
      - target: BibleWidget

  BibleWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Widget
      - path: Sources/BibleVerse.swift
      - path: Sources/en.lproj/Localizable.strings
      - path: Sources/ru.lproj/Localizable.strings
      - path: Sources/hy.lproj/Localizable.strings
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: BibleWidget
        CFBundleDisplayName: BibleWidget
        CFBundleIdentifier: com.samvel.armenianbible.BibleWidget
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: XPC!
        CFBundleExecutable: BibleWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: BibleWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.samvel.armenianbible.BibleWidget
        CODE_SIGN_ENTITLEMENTS: Widget/BibleWidget.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
