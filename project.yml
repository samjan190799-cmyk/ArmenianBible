name: ArmenianBible
options:
  bundleIdPrefix: com.samvel.armenianbible.V7J345DY58
targets:
  ArmenianBible:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: ArmenianBible
        CFBundleDisplayName: ArmenianBible
        CFBundleIdentifier: com.samvel.armenianbible.V7J345DY58
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: ArmenianBible
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchImage
          UIImageRespectsSafetyMargins: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: ArmenianBible
        PRODUCT_BUNDLE_IDENTIFIER: com.samvel.armenianbible.V7J345DY58
        PROVISIONING_PROFILE_SPECIFIER: Samvel_Main_App_Profile
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: "V7J345DY58"
        CODE_SIGN_STYLE: "Manual"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_PRIMARY_APPICON_SET_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
    dependencies:
      - target: BibleWidget
      - sdk: libsqlite3.dylib

  BibleWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
      - path: Sources/BibleVerse.swift
      - path: Sources/en.lproj/Localizable.strings
      - path: Sources/ru.lproj/Localizable.strings
      - path: Sources/hy.lproj/Localizable.strings
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: BibleWidget
        CFBundleDisplayName: BibleWidget
        CFBundleIdentifier: com.samvel.armenianbible.V7J345DY58.BibleWidget
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundlePackageType: XPC!
        CFBundleExecutable: BibleWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: BibleWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.samvel.armenianbible.V7J345DY58.BibleWidget
        PROVISIONING_PROFILE_SPECIFIER: Samvel_Widget_Profile
        GENERATE_INFOPLIST_FILE: "NO"
        DEVELOPMENT_TEAM: "V7J345DY58"
        CODE_SIGN_STYLE: "Manual"
