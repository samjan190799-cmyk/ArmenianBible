name: ArmenianBible
options:
  bundleIdPrefix: com.samvel.armenianbible
packages:
  MyTargetSDK:
    url: https://github.com/myTargetSDK/mytarget-ios-spm
    from: 5.46.0
  # Google Mobile Ads 13.x: адаптер Meta в SPM существует только под 13.4+ (11.x адаптера не имеет)
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.4.0
  # Окно согласия (UMP) для ЕС/Великобритании/Швейцарии; Google SDK уже зависит от него, подключён явно ради import
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.1.0
  # Адаптер Meta Audience Network для AdMob (ставки). Закреплён по коммиту тега 6.22.000:
  # SwiftPM читает такой тег как 6.22.0, но коммит надёжнее
  MetaAdapter:
    url: https://github.com/googleads/googleads-mobile-ios-mediation-meta.git
    revision: 0a3d0597402162334fb5e11816ca612478180095
  # Версия Meta SDK жёстко задана адаптером (exact 6.22.0); подключена ради FBAdSettings
  FBAudienceNetwork:
    url: https://github.com/facebook/FBAudienceNetwork.git
    exactVersion: 6.22.0


targets:
  ArmenianBible:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: ArmenianBible
        CFBundleDisplayName: ArmenianBible
        CFBundleIdentifier: com.samvel.armenianbible
        CFBundleVersion: "${BUILD_NUMBER:1}"
        CFBundleShortVersionString: "3.7"
        CFBundlePackageType: APPL
        CFBundleExecutable: ArmenianBible
        ITSAppUsesNonExemptEncryption: "NO"
        GADApplicationIdentifier: "ca-app-pub-2894315025786699~1008604498"
        NSPhotoLibraryAddUsageDescription: "We need permission to save generated Bible verse wallpapers to your Photos library."
        NSPhotoLibraryUsageDescription: "We need permission to save generated Bible verse wallpapers to your Photos library."
        NSFaceIDUsageDescription: "Protect your personal bookmarks, prayer journal, and notes with Face ID."
        NSUserTrackingUsageDescription: "Your data helps show you more relevant ads and keeps the free version of the app available."
        # Официальные 50 идентификаторов Google (в них входят и Meta: v9wttpbfk9, n38lu8286q) + 2 myTarget (VK)
